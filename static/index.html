<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faff</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* palette */
      --cream: #efece1;
      --teal: #015462;
      --orange: #ee5a36;
      --amber: #f5ab54;

      /* app tokens */
      --bg: var(--cream);
      --surface: #f7f4ed;
      --surface-2: #fbf8f2;
      --border: rgba(1,84,98,0.18);
      --text: var(--teal);
      --text-2: rgba(1,84,98,0.72);
      --text-3: rgba(1,84,98,0.45);
      --accent: var(--orange);     /* primary CTA */
      --accent-2: var(--amber);    /* secondary accent */
      --accent-bg: rgba(238,90,54,0.10);
      --green: #1f9d63;
      --red: #cc3b3b;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; -webkit-font-smoothing: antialiased; }

    /* subtle grid bg */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(1,84,98,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(1,84,98,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    body { overflow: hidden; }
    .page {
      position: relative; z-index: 1;
      height: 100svh; display: flex; flex-direction: column;
      align-items: center; padding: 40px 20px 28px;
    }

    header {
      width: 100%; max-width: 440px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px;
    }
    .header-actions {
      display: flex; align-items: center; gap: 12px;
    }
    .btn-logout {
      background: transparent; border: none;
      padding: 6px 10px; border-radius: 8px;
      font-family: inherit; font-size: 13px; font-weight: 500;
      color: var(--text-2); cursor: pointer;
    }
    .btn-logout:hover {
      color: var(--text); background: rgba(1,84,98,0.06);
    }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -1px; }
    .logo span { color: var(--accent-2); }
    .pill {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: var(--text-3); border: 1px solid var(--border);
      padding: 4px 10px; border-radius: 100px; letter-spacing: 0.5px;
    }

    /* card */
    .card {
      width: 100%; max-width: 440px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 36px;
      position: relative; overflow: hidden;
      flex: 1; display: flex; flex-direction: column;
      min-height: 0;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(238,90,54,0.22), transparent);
    }

    /* panels */
    .panel { display: none; }
    .panel.on { display: flex; flex-direction: column; flex: 1; min-height: 0; animation: up 0.3s ease; }
    /* Connect Google: center block vertically in the card */
    #p1.panel.on { justify-content: center; text-align: center; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 24px; line-height: 1.2; letter-spacing: -0.3px; margin-bottom: 10px; }
    .desc { font-size: 14px; color: var(--text-2); line-height: 1.65; margin-bottom: 28px; }
    .desc strong { color: var(--text); font-weight: 500; }

    /* pills */
    .pills { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 28px; }
    .cpill { display: flex; align-items: center; gap: 5px; padding: 5px 11px; border: 1px solid var(--border); border-radius: 100px; font-size: 12px; color: var(--text-2); background: var(--surface-2); }
    .cpill b { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

    /* buttons */
    .btn {
      width: 100%; padding: 15px 22px; border: none; border-radius: 11px;
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 9px; transition: all 0.2s; letter-spacing: -0.2px;
    }
    .btn-main { background: var(--accent); color: #ffffff; }
    .btn-main:hover { background: #f06a4a; transform: translateY(-1px); }
    .btn-main:active { transform: scale(0.99); }
    .btn-main:disabled { background: var(--surface-2); color: var(--text-3); cursor: not-allowed; transform: none; }
    /* chat panel */
    .chat-wrap {
      display: flex; flex-direction: column;
      flex: 1; min-height: 0;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden; margin-bottom: 14px;
    }
    .chat-msgs {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg { max-width: 92%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.55; word-break: break-word; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: rgba(1,84,98,0.10); color: var(--teal); border: 1px solid rgba(1,84,98,0.14); border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: rgba(238,90,54,0.08); color: var(--teal); border: 1px solid rgba(238,90,54,0.18); border-left: 3px solid var(--accent); border-bottom-left-radius: 4px; }
    .msg.typing { color: var(--text-3); font-style: italic; font-size: 13px; }

    /* enrichment: “hold up… cooking…” */
    .enrich-cooking {
      align-self: center;
      margin: auto 12px;
      padding: 18px 22px;
      border-radius: 14px;
      border: 1px dashed rgba(238,90,54,0.35);
      background: rgba(238,90,54,0.07);
      max-width: 92%;
      text-align: center;
      animation: enrichPop 0.45s ease;
    }
    @keyframes enrichPop {
      from { opacity: 0; transform: scale(0.96) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .enrich-cooking .enrich-muted {
      font-size: 13px;
      color: var(--text-2);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }
    .enrich-cooking .enrich-hot {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 17px;
      color: var(--accent);
      letter-spacing: -0.03em;
      animation: enrichPulse 2.2s ease-in-out infinite;
    }
    .enrich-cooking .enrich-dots {
      display: inline-block;
      margin-left: 1px;
    }
    .enrich-cooking .enrich-dots i {
      font-style: normal;
      animation: enrichDot 1.05s ease-in-out infinite;
    }
    .enrich-cooking .enrich-dots i:nth-child(1) { animation-delay: 0s; }
    .enrich-cooking .enrich-dots i:nth-child(2) { animation-delay: 0.18s; }
    .enrich-cooking .enrich-dots i:nth-child(3) { animation-delay: 0.36s; }
    @keyframes enrichPulse {
      0%, 100% { opacity: 1; filter: brightness(1); }
      50% { opacity: 0.88; filter: brightness(1.06); }
    }
    @keyframes enrichDot {
      0%, 70%, 100% { opacity: 0.2; transform: translateY(0); }
      35% { opacity: 1; transform: translateY(-1px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .enrich-cooking { animation: none; }
      .enrich-cooking .enrich-hot { animation: none; }
      .enrich-cooking .enrich-dots i { animation: none; opacity: 1; }
    }

    .chat-input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); background: var(--surface); }
    .chat-in {
      flex: 1; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 9px; color: var(--text); font-family: inherit; font-size: 14px; outline: none;
    }
    .chat-in:focus { border-color: rgba(238,90,54,0.35); box-shadow: 0 0 0 3px rgba(238,90,54,0.08); }
    .chat-in:disabled { opacity: 0.5; }
    .btn-send {
      padding: 12px 18px; border: none; border-radius: 9px; background: var(--accent); color: #ffffff;
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; flex-shrink: 0;
    }
    .btn-send:hover { background: #f06a4a; }
    .btn-send:disabled { background: var(--surface-2); color: var(--text-3); cursor: not-allowed; }

    /* spinner */
    .spin { width: 14px; height: 14px; border: 2px solid rgba(1,84,98,0.22); border-top-color: var(--teal); border-radius: 50%; animation: s 0.6s linear infinite; display: none; }
    @keyframes s { to { transform: rotate(360deg); } }

    /* error */
    .err { font-size: 12px; color: var(--red); font-family: 'JetBrains Mono', monospace; margin-top: 9px; display: none; }

  </style>
</head>
<body>
<div class="page">

  <header>
    <div class="logo">faff<span>.</span></div>
    <div class="header-actions">
      <button type="button" class="btn-logout" id="btn-logout" onclick="logout()" hidden>Log out</button>
      <div class="pill">EARLY ACCESS</div>
    </div>
  </header>

  <div class="card">

    <!-- Step 1 -->
    <div class="panel on" id="p1">
      <div class="title">Connect your Google account</div>
      <div class="desc">
        Connect Google once, then jump straight into chat.
      </div>
      <button class="btn btn-main" id="btn1" onclick="startAuth()">
        <svg width="17" height="17" viewBox="0 0 18 18" fill="none">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908C16.658 14.116 17.64 11.808 17.64 9.2z" fill="rgba(12,12,10,0.6)"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="rgba(12,12,10,0.6)"/>
          <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="rgba(12,12,10,0.6)"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="rgba(12,12,10,0.6)"/>
        </svg>
        <span id="btn1-label">Connect Google</span>
        <div class="spin" id="spin1"></div>
      </button>
      <div class="err" id="err1">Something went wrong. Try again.</div>
    </div>

    <!-- Step 2 -->
    <div class="panel" id="p2">
      <div class="chat-wrap">
        <div class="chat-msgs" id="chat-msgs"></div>
        <div class="chat-input-row">
          <input class="chat-in" id="chat-in" type="text" placeholder="Message faff…" autocomplete="off"
                 onkeydown="if(event.key==='Enter') sendChat()">
          <button type="button" class="btn-send" id="btn-send" onclick="sendChat()">Send</button>
        </div>
      </div>
      <div class="err" id="err3">Couldn&apos;t send. Try again.</div>
    </div>

  </div><!-- .card -->

</div>

<script>
  let entityId = localStorage.getItem('eid') || crypto.randomUUID();
  localStorage.setItem('eid', entityId);

  let chatBootstrapped = false;

  // ── init ─────────────────────────────────────────────────────────
  const params = new URLSearchParams(location.search);
  const urlStep = parseInt(params.get('step') || '0', 10);
  const urlEntity = params.get('entity_id');
  if (urlEntity) { entityId = urlEntity; localStorage.setItem('eid', entityId); }

  if (urlStep === 2) { go(2); history.replaceState({}, '', '/'); }

  /** Post–Google-auth states where chat should load (same entity_id as localStorage). */
  function statusOpensChat(status) {
    return status === 'enriching' || status === 'pending_first_message' || status === 'active';
  }

  // ── step 1 ────────────────────────────────────────────────────────
  function logout() {
    localStorage.removeItem('eid');
    entityId = crypto.randomUUID();
    localStorage.setItem('eid', entityId);
    chatBootstrapped = false;
    const box = document.getElementById('chat-msgs');
    if (box) box.innerHTML = '';
    const typing = document.getElementById('chat-typing');
    if (typing) typing.remove();
    const input = document.getElementById('chat-in');
    if (input) input.value = '';
    hide('err3');
    go(1);
  }

  async function startAuth() {
    const { status } = await fetchStatus();
    if (statusOpensChat(status)) {
      go(2);
      return;
    }

    const btn = document.getElementById('btn1');
    const label = document.getElementById('btn1-label');
    const spin = document.getElementById('spin1');
    label.textContent = 'Connecting...';
    btn.disabled = true;
    spin.style.display = 'block';

    try {
      const r = await fetch(`/auth/composio/start?entity_id=${entityId}`);
      if (!r.ok) throw new Error();
      const d = await r.json();
      if (d.entity_id) { entityId = d.entity_id; localStorage.setItem('eid', entityId); }
      location.href = d.redirect_url;
    } catch {
      label.textContent = 'Connect Google';
      btn.disabled = false;
      spin.style.display = 'none';
      show('err1');
    }
  }

  // ── status ─────────────────────────────────────────────────────────
  async function fetchStatus() {
    try {
      const r = await fetch(`/api/status/${entityId}`);
      if (!r.ok) return { status: 'unknown' };
      return await r.json();
    } catch {
      return { status: 'unknown' };
    }
  }

  // ── chat ───────────────────────────────────────────────────────────
  function appendMsg(role, text) {
    const box = document.getElementById('chat-msgs');
    const el = document.createElement('div');
    el.className = 'msg ' + (role === 'user' ? 'user' : 'assistant');
    el.textContent = text;
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
  }

  function showEnrichCooking() {
    const box = document.getElementById('chat-msgs');
    if (document.getElementById('enrich-cooking')) return;
    const wrap = document.createElement('div');
    wrap.id = 'enrich-cooking';
    wrap.className = 'enrich-cooking';
    wrap.setAttribute('role', 'status');
    wrap.setAttribute('aria-live', 'polite');
    wrap.innerHTML =
      '<div class="enrich-muted">hold up…</div>' +
      '<div class="enrich-hot">cooking<span class="enrich-dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></div>';
    box.appendChild(wrap);
    box.scrollTop = box.scrollHeight;
  }

  function hideEnrichCooking() {
    const el = document.getElementById('enrich-cooking');
    if (el) el.remove();
  }

  function setTyping(on) {
    const box = document.getElementById('chat-msgs');
    let t = document.getElementById('chat-typing');
    if (on) {
      if (!t) {
        t = document.createElement('div');
        t.id = 'chat-typing';
        t.className = 'msg assistant typing';
        t.textContent = 'faff is typing…';
        box.appendChild(t);
        box.scrollTop = box.scrollHeight;
      }
    } else if (t) {
      t.remove();
    }
  }

  async function postChat(message) {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ entity_id: entityId, message }),
    });
    if (!r.ok) throw new Error();
    const d = await r.json();
    return Array.isArray(d.replies) ? d.replies : [String(d.reply || '')].filter(Boolean);
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function appendAssistantReplies(replies) {
    const lines = (replies || []).map(x => String(x || '').trim()).filter(Boolean);
    for (let i = 0; i < lines.length; i++) {
      appendMsg('assistant', lines[i]);
      if (i !== lines.length - 1) await sleep(260);
    }
  }

  async function sendChatMessage(text) {
    const t = String(text || '').trim();
    if (!t) return;
    hideEnrichCooking();
    hide('err3');
    const input = document.getElementById('chat-in');
    const sendBtn = document.getElementById('btn-send');
    input.value = '';
    appendMsg('user', t);
    input.disabled = true;
    sendBtn.disabled = true;
    setTyping(true);
    try {
      const replies = await postChat(t);
      setTyping(false);
      await appendAssistantReplies(replies);
    } catch {
      setTyping(false);
      show('err3');
    } finally {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  async function bootstrapChat() {
    if (chatBootstrapped) return;
    chatBootstrapped = true;
    const input = document.getElementById('chat-in');
    const sendBtn = document.getElementById('btn-send');
    input.disabled = true;
    sendBtn.disabled = true;
    hide('err3');

    let hadHistory = false;
    try {
      const hr = await fetch(`/api/chat/history/${entityId}`);
      if (!hr.ok) throw new Error();
      const { messages } = await hr.json();

      const box = document.getElementById('chat-msgs');
      box.innerHTML = '';

      if (messages && messages.length) {
        hadHistory = true;
        messages.forEach(m => appendMsg(m.role, m.content));
      }
    } catch {
      chatBootstrapped = false;
      show('err3');
      hideEnrichCooking();
      input.disabled = false;
      sendBtn.disabled = false;
      return;
    }

    if (!hadHistory) showEnrichCooking();

    await gateChatUntilReady();

    if (!hadHistory) {
      await sendChatMessage('Hi there');
    } else {
      input.focus();
    }
  }

  async function gateChatUntilReady() {
    const input = document.getElementById('chat-in');
    const sendBtn = document.getElementById('btn-send');

    input.disabled = true;
    sendBtn.disabled = true;

    for (let i = 0; i < 120; i++) { // ~2 minutes max
      const { status } = await fetchStatus();
      if (status && status !== 'enriching' && status !== 'pending_auth') {
        hideEnrichCooking();
        input.disabled = false;
        sendBtn.disabled = false;
        return;
      }
      showEnrichCooking();
      await sleep(1000);
    }

    hideEnrichCooking();
    input.disabled = false;
    sendBtn.disabled = false;
  }

  async function sendChat() {
    const input = document.getElementById('chat-in');
    const text = (input.value || '').trim();
    if (!text) return;
    await sendChatMessage(text);
  }

  // ── transitions ────────────────────────────────────────────────────
  function go(n) {
    [1, 2].forEach(i => {
      document.getElementById(`p${i}`).classList.toggle('on', i === n);
    });
    const btnLogout = document.getElementById('btn-logout');
    if (btnLogout) btnLogout.hidden = n !== 2;
    if (n === 2) bootstrapChat();
  }

  function show(id) { document.getElementById(id).style.display = 'block'; }
  function hide(id) { document.getElementById(id).style.display = 'none'; }

  // ── Cold load / refresh: jump to chat if this browser already has an onboarded session ──
  (async function resumeSessionIfNeeded() {
    if (urlStep === 2) return;
    const { status } = await fetchStatus();
    if (statusOpensChat(status)) go(2);
  })();
</script>
</body>
</html>
